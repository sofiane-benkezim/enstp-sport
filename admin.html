<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>ENSTP SPORT — إدارة الحجوزات</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.admin-wrap{max-width:1100px;margin:45px auto;padding:0 22px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:22px}.admin-login{max-width:450px}.admin-form{display:grid;gap:13px}.admin-form label{display:grid;gap:5px;font-size:12px;font-weight:800}.admin-form input,.admin-form select,.admin-form textarea{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px}.admin-booking{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:1px solid var(--line);padding:18px 0}.admin-booking:last-child{border-bottom:0}.admin-booking p{margin:5px 0;color:var(--muted);font-size:12px}.admin-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.admin-actions button{border:0;border-radius:8px;padding:10px 13px;font-weight:800}.approve{background:#d5f36a;color:#10243a}.reject{background:#ffe1e1;color:#9b2929}.small-muted{color:var(--muted);font-size:12px}@media(max-width:650px){.admin-booking{grid-template-columns:1fr}.admin-wrap{margin-top:25px}}</style></head><body><div class="announcement"><span class="live-dot"></span>ENSTP SPORT — لوحة إدارة الحجوزات</div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">ES</span><span class="brand-copy"><strong>ENSTP <b>SPORT</b></strong><small>ADMINISTRATION</small></span></a><div class="header-actions"><button class="icon-button" id="themeToggle">☾</button><button class="button button-dark" id="loginButton">تسجيل الدخول</button></div></header><main class="admin-wrap"><div class="admin-top"><div><div class="eyebrow"><span class="eyebrow-line"></span>إدارة المرافق الرياضية</div><h1>طلبات الحجز</h1><p class="small-muted">هذه الصفحة تتطلب حسابًا مُعيّنًا كمدير في جدول user_roles.</p></div><button class="button button-outline" id="refreshButton">تحديث الطلبات ↻</button></div><section class="admin-card admin-login" id="loginCard"><h2>دخول المدير</h2><form id="loginForm" class="admin-form"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="current-password"></label><button class="button button-lime" type="submit">دخول</button><p id="loginMessage" class="small-muted"></p></form></section><section class="admin-card" id="bookingsCard" hidden><h2>الطلبات الواردة</h2><p class="small-muted">لا تظهر هنا إلا الطلبات التي تسمح صلاحيات حساب المدير برؤيتها.</p><div id="bookingsList"></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
